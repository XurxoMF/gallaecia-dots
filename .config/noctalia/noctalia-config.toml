center = [ "workspaces" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
margin_edge = 0
margin_ends = 0
radius = 0
radius_bottom_left = -20
radius_bottom_right = -20
start = [ "clock", "launcher", "wallpaper" ]
widget_spacing = 8

