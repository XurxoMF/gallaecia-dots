[plugins]
enabled = []

[shell]
font_family = "Adwaita Sans"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true

    [shell.screen_corners]
    enabled = true
    size = 20

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "qt" ]

[wallpaper]
directory = "/home/xurxomf/Descargas"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/xurxomf/Descargas/wallpaper-1.jpg"

    [wallpaper.last]
    path = "/home/xurxomf/Descargas/wallpaper-1.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/xurxomf/Descargas/wallpaper-1.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/xurxomf/Descargas/wallpaper-1.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/xurxomf/Descargas/wallpaper-1.jpg"

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false
