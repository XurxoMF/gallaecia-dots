#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 2, 3, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
sort_fallback  = "alphabetical"
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = "${EDITOR:-nvim} %s", desc = "Editar", for = "unix", block = true },
]
play = [
	{ run = "xdg-open %s1",    desc = "Executar", for = "linux", orphan = true },
	{ run = "mediainfo %s1; echo 'Preme Intro para saír'; read _", block = true, desc = "Mostrar información multimedia", for = "unix" },
]
open = [
	{ run = "xdg-open %s1",    desc = "Abrir", for = "linux" },
]
reveal = [
	{ run = "xdg-open %d1",         desc = "Mostrar", for = "linux" },
	{ run = "clear; exiftool %s1; echo 'Preme Intro para saír'; read _", desc = "Mostrar EXIF", for = "unix", block = true },
]
extract = [
	{ run = "ya pub extract --list %s", desc = "Extraer aquí" },
]
download = [
	{ run = "ya emit download --open %S", desc = "Descargar e abrir" },
	{ run = "ya emit download %S",        desc = "Descargar" },
]
trash = [
	{ run = "ya pub trash-restore --list %S", desc = "Restaurar os ficheiros seleccionados" },
	{ run = "ya pub trash-empty --list %S",   desc = "Baleirar o lixo" },
]

[open]
rules = [
	# Cartafol
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Texto
	{ mime = "text/*", use = [ "edit", "open", "reveal" ] },
	# Imaxe
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Multimedia
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Código
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "open", "reveal" ] },
	# Arquivo
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Ficheiro baleiro
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Sistema de ficheiros virtual
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Lixo
	{ mime = "trash/**", use = [ "open", "trash" ] },
	# Alternativa
	{ url = "*", use = [ "open", "reveal" ] },
]

[tasks]
file_workers     = 3
plugin_workers   = 5
fetch_workers    = 5
preload_workers  = 2
process_workers  = 5
bizarre_retry    = 3
image_alloc      = 1073741824  # 1024MB
image_bound      = [ 10000, 10000 ]
suppress_preload = false

[plugin]
fetchers = [
	# Plugin git
	{ url = "*", run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },

	# Tipo MIME
	{ url = "*/",         run = "mime.dir",    prio = "high", group = "mime" },
	{ url = "local://*",  run = "mime.local",  prio = "high", group = "mime" },
	{ url = "trash://*",  run = "mime.trash",  prio = "high", group = "mime" },
	{ url = "remote://*", run = "mime.remote", prio = "high", group = "mime" },
]
spotters = [
	# Multificheiro
	{ mime = "multi/*", run = "multi" },
	# Lixo
	{ mime = "trash/**", run = "trash" },
	# Cartafol
	{ url = "*/", run = "folder" },
	# Código
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# Imaxe
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Vídeo
	{ mime = "video/*", run = "video" },
	# Sistema de ficheiros virtual
	{ mime = "vfs/*", run = "vfs" },
	# Erro
	{ mime = "null/*", run = "null" },
	# Alternativa
	{ url = "*", run = "file" },
]
preloaders = [
	# Imaxe e Vídeo
	{ mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
	# Adobe Illustrator
	{ mime = "application/postscript", run = "mediainfo" },
	{ mime = "application/illustrator", run = "mediainfo" },
	{ mime = "application/dvb.ait", run = "mediainfo" },
	{ mime = "application/vnd.adobe.illustrator", run = "mediainfo" },
	{ mime = "image/x-eps", run = "mediainfo" },
	{ mime = "application/eps", run = "mediainfo" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Tipo de letra
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Algunhas veces os arquivos de IA os detecta como "application/pdf".
	# Neste caso usamos a extensión do arquivo para evitalo.
	{ url = "*.{ai,eps,ait}", run = "mediainfo" },
	# Lixo
	{ mime = "trash/**", run = "trash" },
]
previewers = [
	{ url = "*/", run = "folder" },
	# Código
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# JSON
	{ mime = "application/{json,ndjson}", run = "json" },
	# Imaxe e Vídeo
	{ mime = "{audio,video,image}/*", run = "mediainfo"},
  { mime = "application/subrip", run = "mediainfo" },
	# Adobe Illustrator
	{ mime = "application/postscript", run = "mediainfo" },
	{ mime = "application/illustrator", run = "mediainfo" },
	{ mime = "application/dvb.ait", run = "mediainfo" },
	{ mime = "application/vnd.adobe.illustrator", run = "mediainfo" },
	{ mime = "image/x-eps", run = "mediainfo" },
	{ mime = "application/eps", run = "mediainfo" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Arquivo
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
	{ mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
	{ url = "*.{AppImage,appimage}", run = "archive" },
	# Disco virtual / Imaxe de disco
	{ mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
	{ mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
	{ url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
	# Tipo de letra
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Algunhas veces os arquivos de IA os detecta como "application/pdf".
	# Neste caso usamos a extensión do arquivo para evitalo.
	{ url = "*.{ai,eps,ait}", run = "mediainfo" },
	# Ficheiro baleiro
	{ mime = "inode/empty", run = "empty" },
	# Sistema de ficheiros virtual
	{ mime = "vfs/*", run = "vfs" },
	# Lixo
	{ mime = "trash/**", run = "trash" },
	# Erro
	{ mime = "null/*", run = "null" },
	# Alternativa
	{ url = "*", run = "file" },
]

[input]
cursor_blink = false

# cd
cd_title  = "Cambiar directorio:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = [ "Crear:", "Crear (directorio):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Renomear:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# filter
filter_title  = "Filtrar:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Buscar seguinte:", "Buscar anterior:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Buscar con {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (bloqueante):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
# trash
trash_title 	= "Mover {n} ficheiro{s} seleccionado{s} ao lixo?"
trash_origin	= "center"
trash_offset	= [ 0, 0, 70, 20 ]

# delete
delete_title 	= "Eliminar permanentemente {n} ficheiro{s} seleccionado{s}?"
delete_origin	= "center"
delete_offset	= [ 0, 0, 70, 20 ]

# overwrite
overwrite_title  = "Sobrescribir ficheiro?"
overwrite_body   = "Sobrescribirase o seguinte ficheiro:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]

# quit
quit_title  = "Saír?"
quit_body   = "Hai tarefas sen rematar, saír igualmente?\n(Abre o xestor de tarefas coa tecla predeterminada 'w')"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Abrir con:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false
